<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(to bottom, #fff, #fff);
  text-align: center;
}

.container {
  margin-top: 30px;
  padding: 20px;
}

.logo {
  width: 350px;
  max-width: 90%;
  height: auto;
  margin-bottom: 15px;
}

h1 {
  font-size: 42px;
  font-weight: 700;
  color: #c2185b;
  margin: 10px 0;
}

.subtitle {
  font-size: 18px;
  margin-bottom: 25px;
  color: #333;
}

/* شريط الخدمات المتحرك */
.services-marquee {
  width: 100%;
  overflow: hidden;
  background: #f5eadd;
  border-radius: 25px;
  padding: 12px 0;
  margin: 0 auto 25px;
  box-sizing: border-box;
}

.marquee-track {
  display: flex;
  width: max-content;
  direction: rtl;
  animation: move-marquee 25s linear infinite;
}

.marquee-group {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  direction: rtl;
}

.service-item {
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  font-size: 19px;
  font-weight: 700;
  color: #333;
  padding: 0 12px;
}

.service-logo {
  width: 42px;
  height: 27px;
  object-fit: contain;
  mix-blend-mode: multiply;
  margin: 0 12px;
}

@keyframes move-marquee {
  from {
    transform: translateX(0);
  }
  to {
    transform: translateX(-50%);
  }
}

.services-marquee:hover .marquee-track {
  animation-play-state: paused;
}

/* الأزرار */
.links a {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin: 10px auto;
  width: 270px;
  padding: 14px;
  color: white;
  text-decoration: none;
  border-radius: 25px;
  font-size: 18px;
  transition: 0.3s;
}

.links a:hover {
  transform: scale(1.05);
}

.store {
  background: #30d80f;
  color: #000;
}

.whatsapp {
  background: #08dd56;
}

.tiktok {
  background: #000000;
}

.instagram {
  background: linear-gradient(45deg,#feda75,#d62976,#962fbf);
}

.website {
  background: #F2E500;
  color: #000;
}

.whatsapp-float {
  position: fixed;
  bottom: 5px;
  right: 20px;
  background: #070bf3;
  color: white;
  padding: 14px 18px;
  border-radius: 40px;
  text-decoration: none;
  font-size: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  z-index: 999;
}

@media (max-width: 600px) {
  .container {
    margin-top: 20px;
  }

  .logo {
    width: 300px;
  }

  .services-marquee {
    border-radius: 18px;
    padding: 10px 0;
  }

  .service-item {
    font-size: 16px;
    padding: 0 8px;
  }

  .service-logo {
    width: 35px;
    height: 23px;
    margin: 0 8px;
  }

  .marquee-track {
    animation-duration: 22s;
  }

  .whatsapp-float {
    bottom: 5px;
    right: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .marquee-track {
    animation: none;
  }
}
</style>
